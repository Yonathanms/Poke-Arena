# ==============================================================================
# POKÉ-ARENA - BASES DE DATOS LOCALES CON DOCKER COMPOSE
#
# Uso:
#   docker compose up -d       (Inicia PostgreSQL y MongoDB en segundo plano)
#   docker compose down        (Detiene las bases de datos conservando la data)
#   docker compose down -v     (Detiene y borra volúmenes para empezar en limpio)
#
# Tanto el Backend (FastAPI en :8000) como el Frontend (Vite en :5173) se ejecutan
# directamente en local (Windows) sin contenedores.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 (Base de Datos Relacional ACID)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pokearena-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-pokearena_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pokearena_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. MongoDB 7 (Base de Datos NoSQL Documental - Proyecciones de Catálogo)
  # ----------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: pokearena-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mongoadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongo_secure_pass_2026}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-pokearena_catalog}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

# ==============================================================================
# VOLÚMENES PERSISTENTES
# ==============================================================================
volumes:
  postgres_data:
    name: pokearena_postgres_data
  mongo_data:
    name: pokearena_mongo_data
