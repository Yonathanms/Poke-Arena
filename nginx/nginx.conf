user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'correlation_id="$http_x_correlation_id" upstream="$upstream_addr"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Límite de tamaño para subida de imágenes (5MB)
    client_max_body_size 10M;

    # --------------------------------------------------------------------------
    # Upstream: Balanceador de Carga Round-Robin para Backend (RNF-REN-03)
    # --------------------------------------------------------------------------
    upstream backend_cluster {
        server backend-1:8000;
        server backend-2:8000;
    }

    # Upstream: Servicio Frontend
    upstream frontend_cluster {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        # ----------------------------------------------------------------------
        # Rutas de API y Documentación OpenAPI (RNF-API-01)
        # ----------------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;
        }

        location /docs {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /redoc {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /openapi.json {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ----------------------------------------------------------------------
        # Servir Archivos Estáticos de Medios (Imágenes de cartas y ubicaciones)
        # ----------------------------------------------------------------------
        location /uploads/ {
            alias /var/www/uploads/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # ----------------------------------------------------------------------
        # Frontend SPA (React + Vite)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
